name: CI

on:
  pull_request:
    branches: [main]

# Cancel any in-flight CI run for the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimal scope — none of these jobs write back to the repo. If a future job
# needs to comment on a PR or push a tag, override `permissions:` on that job
# only, not at the workflow level.
permissions:
  contents: read

# Turbo automatically picks these up to talk to the Vercel Remote Cache
# (ADR-039). Empty values are fine — Turbo falls back to local-only caching
# when the token is unset.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Action pins use commit SHAs (not `@v4`) to defend against tag-move
      # supply-chain attacks; Dependabot updates via the version comment.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run lint

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Action pins use commit SHAs (not `@v4`) to defend against tag-move
      # supply-chain attacks; Dependabot updates via the version comment.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run type-check

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      # Action pins use commit SHAs (not `@v4`) to defend against tag-move
      # supply-chain attacks; Dependabot updates via the version comment.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup

      # Create a per-run Neon branch so test:unit always sees a fresh,
      # isolated database. Skips when secrets are unset so a no-op throwaway
      # PR before the operator finishes the Neon setup still passes — the
      # `test:unit` slice in Phase 0 doesn't touch the DB yet.
      - name: Create Neon ephemeral branch
        id: neon
        if: env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          branch_name="ci-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}"
          response=$(
            curl --silent --show-error --fail-with-body --max-time 30 \
              -X POST \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
              -H "Authorization: Bearer ${NEON_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"branch\":{\"name\":\"${branch_name}\"},\"endpoints\":[{\"type\":\"read_write\"}]}"
          )
          branch_id=$(printf '%s' "$response" | jq -r '.branch.id // ""')
          if [ -z "$branch_id" ] || [ "$branch_id" = "null" ]; then
            echo "::error::Neon API did not return a branch id"
            exit 1
          fi
          # Emit branch_id immediately so the always() cleanup step can run
          # even if connection_uri validation fails below.
          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"

          # Per the Neon API, `connection_uris` is omitted when the branch
          # has no single database+role pair (e.g. multiple databases or no
          # role). Don't paper over that with a literal "null" — fail loudly.
          connection_uri=$(printf '%s' "$response" | jq -r '.connection_uris[0].connection_uri // ""')
          if [ -z "$connection_uri" ] || [ "$connection_uri" = "null" ]; then
            echo "::error::Neon API did not return a connection_uri (branch $branch_id; check the project has a single database + role)"
            exit 1
          fi
          echo "::add-mask::$connection_uri"
          echo "DATABASE_URL=$connection_uri" >> "$GITHUB_ENV"

      # Migration test (Phase 1 / Commit 1.3). Runs every drizzle migration
      # forward, asserts the expected 23 tables + 8 enums, then drops the
      # public schema and asserts it returns to empty. A purposely-broken
      # migration causes the script to exit non-zero and fails this job.
      #
      # PROD_DB_ALLOWED=true: the script's @bec/config-side `assertProdDb-
      # Accessible()` guard refuses to run unless the env is "production"
      # OR PROD_DB_ALLOWED is set. CI's Neon ephemeral branch is a per-PR
      # throwaway — the guard's "don't write to prod from a dev machine"
      # intent doesn't apply, and we explicitly opt in.
      #
      # Skipped when the Neon branch wasn't created (no DATABASE_URL).
      - name: Test migrations
        if: steps.neon.outputs.branch_id != ''
        env:
          PROD_DB_ALLOWED: "true"
        run: pnpm --filter @bec/db db:test-migrations

      - name: Run unit tests
        run: pnpm turbo run test:unit

      # Always attempt cleanup so failed runs don't leak Neon branches. Guarded
      # on `branch_id` so it no-ops when the creation step was skipped.
      - name: Delete Neon ephemeral branch
        if: always() && steps.neon.outputs.branch_id != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --max-time 30 \
            -X DELETE \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${{ steps.neon.outputs.branch_id }}" \
            -H "Authorization: Bearer ${NEON_API_KEY}"
